# Include inside the research server block. Vite's content hash is eight characters.
autoindex off;

location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}

location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(?:js|css|woff2?|png|jpe?g|webp|svg|avif)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
}

location /research/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
}

location ~ /\. {
    return 404;
}

location / {
    try_files $uri $uri/ /index.html;
}
