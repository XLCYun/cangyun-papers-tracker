# Initial HTTP vhost, used before the independent TLS certificate is issued.
server {
    listen 80;
    listen [::]:80;
    server_name research.cyunlab.com;

    root /var/www/cangyun-papers-tracker/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    include /etc/nginx/snippets/cangyun-research-static.conf;
}
