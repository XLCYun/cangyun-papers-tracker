# Independent research vhost; do not replace the main site's certificate or root.
server {
    listen 80;
    listen [::]:80;
    server_name research.cyunlab.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://research.cyunlab.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name research.cyunlab.com;

    ssl_certificate /etc/letsencrypt/live/research.cyunlab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/research.cyunlab.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/cangyun-papers-tracker/current;
    index index.html;

    include /etc/nginx/snippets/cangyun-research-static.conf;
}
