[project]
name = "cangyun-papers-tracker"
version = "0.1.0"
description = "Official arXiv daily announcement collector for CY Lab Research"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "oss2==2.19.1",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
